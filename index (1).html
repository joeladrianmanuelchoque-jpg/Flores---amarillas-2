<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 🌻</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:Georgia,serif;
}

.escena{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
        #17121c 0%,
        #08070d 45%,
        #000 100%);
}

/* ESTRELLAS */

.estrellas{
    position:absolute;
    inset:0;
}

.estrella{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white;
    animation:brillar 2s infinite alternate;
}

@keyframes brillar{
    from{
        opacity:.15;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* FLORES */

.flores{
    position:absolute;
    inset:0;
}

.flor{
    position:absolute;
    font-size:45px;
    animation:subir linear infinite;
    opacity:0;
    filter:drop-shadow(0 0 10px #e9a900);
}

@keyframes subir{

    0%{
        transform:translateY(110vh) rotate(0deg) scale(.5);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:.9;
    }

    100%{
        transform:translateY(-20vh)
                   translateX(50px)
                   rotate(360deg)
                   scale(1.2);
        opacity:0;
    }
}

/* TEXTO */

.textos{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    perspective:1000px;
}

.texto{
    position:absolute;
    width:90%;
    color:#ffe8a0;
    font-size:clamp(28px,7vw,65px);
    font-weight:bold;
    line-height:1.2;
    text-shadow:
        0 0 10px #d99c20,
        0 0 30px #9c6c12;

    opacity:0;

    animation:entrar 16s infinite;
}

.texto:nth-child(2){
    animation-delay:4s;
}

.texto:nth-child(3){
    animation-delay:8s;
}

.texto:nth-child(4){
    animation-delay:12s;
}

@keyframes entrar{

    0%{
        opacity:0;
        transform:translateZ(-1000px) scale(.1);
    }

    20%{
        opacity:1;
    }

    55%{
        opacity:1;
    }

    75%{
        opacity:0;
        transform:translateZ(200px) scale(1.3);
    }

    100%{
        opacity:0;
        transform:translateZ(700px) scale(2);
    }
}

/* LUZ CENTRAL */

.luz{
    position:absolute;
    left:50%;
    top:50%;

    width:350px;
    height:350px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(255,193,45,.18),
        transparent 70%
    );

    animation:pulso 4s infinite;
}

@keyframes pulso{

    50%{
        transform:translate(-50%,-50%) scale(1.3);
        opacity:.5;
    }
}

/* BOTÓN */

.boton{
    position:absolute;
    z-index:10;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    padding:15px 28px;

    border-radius:30px;

    border:1px solid #e7c45e;

    background:rgba(0,0,0,.7);

    color:#ffe8a0;

    font-size:16px;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(255,210,70,.3);
}

.iniciado .boton{
    display:none;
}

.iniciado .flor,
.iniciado .texto{
    animation-play-state:running;
}

/* FRASE INFERIOR */

.final{
    position:absolute;
    bottom:25px;
    width:100%;

    text-align:center;

    color:rgba(255,235,170,.6);

    font-family:Arial,sans-serif;

    font-size:13px;

    letter-spacing:3px;
}
</style>
</head>


<body>

<div class="escena" id="escena">

    <div class="estrellas" id="estrellas"></div>

    <div class="flores" id="flores"></div>

    <div class="luz"></div>

    <div class="textos">

        <div class="texto">
            Eres mi lugar favorito 🌻
        </div>

        <div class="texto">
            Contigo todo es más bonito ❤️
        </div>

        <div class="texto">
            Mi corazón siempre te elige
        </div>

        <div class="texto">
            Te quiero muchísimo 🌻
        </div>

    </div>

    <button class="boton" onclick="comenzar()">
        Toca aquí para comenzar ✨
    </button>

    <div class="final">
        HECHO CON CARIÑO
    </div>

</div>


<script>

/* ESTRELLAS */

const estrellas =
document.getElementById("estrellas");

for(let i=0;i<100;i++){

    let estrella =
    document.createElement("div");

    estrella.className="estrella";

    estrella.style.left =
    Math.random()*100+"%";

    estrella.style.top =
    Math.random()*100+"%";

    estrella.style.animationDelay =
    Math.random()*3+"s";

    estrellas.appendChild(estrella);
}


/* FLORES */

const flores =
document.getElementById("flores");

for(let i=0;i<30;i++){

    let flor =
    document.createElement("div");

    flor.className="flor";

    flor.innerHTML =
    Math.random()>.2 ? "🌻" : "✨";

    flor.style.left =
    Math.random()*100+"%";

    flor.style.animationDuration =
    (8+Math.random()*10)+"s";

    flor.style.animationDelay =
    (-Math.random()*15)+"s";

    flor.style.fontSize =
    (25+Math.random()*40)+"px";

    flores.appendChild(flor);
}


/* INICIAR */

function comenzar(){

    document
    .getElementById("escena")
    .classList.add("iniciado");

}

</script>

</body>
</html>
